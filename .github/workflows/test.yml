name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Fcitx5 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            extra-cmake-modules build-essential cmake

      - name: Build and test
        run: |
          cd fcitx5-plugin
          cmake -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          cd build && ctest --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Fcitx5 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            extra-cmake-modules build-essential cmake

      - name: Build with AddressSanitizer and run tests
        run: |
          cd fcitx5-plugin
          cmake -B build-san -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fsanitize=leak -fno-omit-frame-pointer"
          cmake --build build-san
          cd build-san && ctest --output-on-failure
