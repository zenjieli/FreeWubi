name: format-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        # Pinned to match the local version; the PyPI package bundles its own LLVM.
        run: pip install clang-format==22.1.5

      - name: Check formatting
        # Fails on any file clang-format would change. Checks every tracked .cpp/.h
        # in the repo (git ls-files excludes gitignored build artifacts).
        run: |
          set -euo pipefail
          clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')
